name: Go Test (oldstable)

on:
  push:
    paths:
      - "**.go"
  pull_request:
    paths:
      - "**.go"

jobs:
  build:
    # Disable until Go v1.28, because we need v1.27+ for jsonv2
    # so oldstable cannot build it right now
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'oldstable'

      - name: Build
        run: go build -v ./cmd/...

      - name: Tests
        run: go test -v ./...
