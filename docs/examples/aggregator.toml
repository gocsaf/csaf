workers = 2
folder = "/var/csaf_aggregator"
lock_file = "/var/lock/csaf_aggregator/lock"
web = "/var/csaf_aggregator/html"
domain = "https://localhost:9443"
rate = 10.0
insecure = true
#verbose = false
#openpgp_private_key =
#openpgp_public_key =
#interim_years =
#passphrase =
#write_indices = false
#time_range =

# specification requires at least two providers (default),
# to override for testing, enable:
# allow_single_provider = true

# URL path below `domain` where aggregator is served.
# Path below `web` where aggregator is written.
# aggregator_path = "/.well-known/csaf-aggregator"

# CSAF versions served by this aggregator: "2.0", "2.1", or both.
# Each version has its own aggregator.json and mirrors, inside
# `version_folders` when serving multiple versions. Providers are
# checked for each version and skipped if they do not serve it.
# Also: see providers.csaf_versions.
# csaf_versions = ["2.0"]

# Store each CSAF version's tree in a "v2.0" or "v2.1" folder
# under `aggregator_path`. This is required when serving multiple versions.
# The `aggregator.json` at `aggregator_path` becomes a symlink to
# the authoritative version's file (CSAF 2.1, section 7.4.4).
#version_folders = false

# Version whose aggregator.json is served at aggregator_path, usually the
# well-known URL. Defaults to the lowest configured version.
#authoritative_version = "2.0"

# Set the maintenance window of the aggregator.
# Only written into the CSAF 2.1 aggregator.json.
#maintained_from = 2026-01-01T00:00:00Z
#maintained_until = 2027-01-01T00:00:00Z

[aggregator]
  # Set if this instance shall be a mirror (aka `aggregator`) or a `lister`.
  # This determines the default value for the entries in [[provider]].
  category = "aggregator"
  name = "Example Development CSAF Aggregator"
  contact_details = "some @ somewhere"
  issuing_authority = "This service is provided as it is. It is gratis for everybody."
  namespace = "https://testnamespace.example.org"

[[providers]]
  name = "local-dev-provider"
  domain = "localhost"
  categories = ["Example Company Product A", "expr:document.lang"]
  create_service_document = true
#  rate = 1.5
#  insecure = true
#  time_range =

[[providers]]
  name = "local-dev-provider2"
  domain = "https://localhost:8443/.well-known/csaf/provider-metadata.json"
#  rate = 1.2
#  insecure = true
  write_indices = true
  client_cert = "./../devca1/testclient1.crt"
  client_key = "./../devca1/testclient1-key.pem"
#  client_passphrase = # Limited and experimental, see downloader doc.
#  header =
# Restrict entry to only sync CSAF version 2.0.
# If no csaf_versions set, entry is tried by all csaf_versions on aggregator.
# csaf_versions = ["2.0"]

[[providers]]
  name = "local-dev-provider3"
  domain = "localhost"
#  rate = 1.8
#  insecure = true
  write_indices = true
  # If aggregator.category == "aggregator", set for an entry that should
  # be listed in addition:
  category = "lister"
# ignore_pattern = [".*white.*", ".*red.*"]
